<!DOCTYPE html>

<head>

    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>FinanU - AI Onboarding</title>

    <style>
        body {
            font-family: 'Geist', sans-serif;
            background-color: #090A0D;
            /* Base Level 0 from Style Guidance */
            color: #e3e2e6;
            -webkit-font-smoothing: antialiased;
        }

        .glass-panel {
            background: rgba(31, 31, 35, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pulse-border {
            box-shadow: 0 0 12px rgba(255, 186, 60, 0.3);
            border: 1px solid rgba(255, 186, 60, 0.6);
        }

        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-4px);
            }
        }

        .gradient-mesh {
            background-image: radial-gradient(at 0% 0%, rgba(99, 241, 134, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 186, 60, 0.1) 0px, transparent 50%);
        }
    </style>

        <div class="flex items-center gap-stack-md"><button
                class="p-2 hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-100"><span

                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEVed2cAWQhnZmCYEo8c7WnwYIxlNA8zO2VYCdovKuhg8KE8xlG8sQc2GXEJnMN9ixwYTJD6kYNpQY5zWsG8phfAnIPEbAVRwXXhi7uF2IfyHaMDGbrS9cbxmQ1uKXP6_JVfyznFvUHS4BGbnL8Lj_2hsO94H0FvU3lASYXdyoEWPjreBt9DIb-X8ccHLAdA3bkAYarOgY9tIlEr69X5ypl3nQV1XMAKsFN-5xraYqqsprwwB8RJ_DjBwylcNmUSw_KIjXOL-fLu0L"
                alt="Finanu Logo" class="h-6 md:h-8 object-contain"></div>
        <div class="flex gap-2">
            <span class="font-label-md text-on-surface-variant bg-surface-container px-3 py-1 rounded-full">Step 2 of
                4</span>
        </div>
    </header>
    <main
        class="relative h-[calc(100vh-64px)] w-full max-w-lg mx-auto flex flex-col p-container-padding overflow-y-auto gradient-mesh">
        <!-- Conversation Thread -->
        <div class="flex flex-col gap-stack-lg mt-stack-md flex-grow">
            <!-- Agent Message -->
            <div class="flex flex-col gap-base max-w-[85%] animate-fade-in">
                <div class="glass-panel p-stack-md rounded-xl rounded-tl-none">
                    <p class="font-body-md text-on-surface">
                        To help build your custom dashboard, what are your main financial interests?
                    </p>
                </div>
                <span class="font-label-sm text-on-surface-variant ml-1">10:24 AM</span>
            </div>
            <!-- Interaction Section (Options) -->
            <div class="flex flex-col gap-stack-md mt-4">
                <h3 class="font-label-md text-on-surface-variant uppercase tracking-wider ml-1">Select all that apply
                </h3>
                <div class="grid grid-cols-1 gap-gutter">
                    <!-- Option 1 -->
                    <button
                        class="group relative flex items-center justify-between p-stack-md glass-panel rounded-xl hover:bg-surface-container transition-all duration-200 text-left overflow-hidden"
                        onclick="toggleSelect(this)"
                        style="opacity: 1; transform: translateY(0px); transition: 0.4s ease-out;">
                        <div class="flex items-center gap-stack-md z-10">
                            <div
                                class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary-container/20 text-primary">
                                <span class="material-symbols-outlined" data-weight="fill">currency_bitcoin</span>
                            </div>
                            <div>
                                <p class="font-title-md text-on-surface group-hover:text-secondary transition-colors">
                                    Crypto</p>

                            </div>
                        </div>
                        <span
                            class="material-symbols-outlined text-secondary opacity-0 transition-opacity z-10 selection-icon">check_circle</span>
                        <div
                            class="absolute inset-0 bg-secondary/5 opacity-0 group-hover:opacity-100 transition-opacity">
                        </div>
                    </button>
                    <!-- Option 2 -->
                    <button
                        class="group relative flex items-center justify-between p-stack-md glass-panel rounded-xl hover:bg-surface-container transition-all duration-200 text-left overflow-hidden"
                        onclick="toggleSelect(this)"
                        style="opacity: 1; transform: translateY(0px); transition: 0.4s ease-out;">
                        <div class="flex items-center gap-stack-md z-10">
                            <div
                                class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary-container/20 text-primary">
                                <span class="material-symbols-outlined" data-weight="fill">show_chart</span>
                            </div>
                            <div>
                                <p class="font-title-md text-on-surface group-hover:text-secondary transition-colors">

                                </p>
                            </div>
                        </div>
                        <span

                        <div

                    <!-- Option 4 -->
                    <button
                        class="group relative flex items-center justify-between p-stack-md glass-panel rounded-xl hover:bg-surface-container transition-all duration-200 text-left overflow-hidden"
                        onclick="toggleSelect(this)"
                        style="opacity: 1; transform: translateY(0px); transition: 0.4s ease-out;">

        <!-- Footer Action -->
        <div class="sticky bottom-0 bg-transparent pb-8 pt-4 flex flex-col gap-stack-md">

                class="w-full py-4 bg-secondary text-on-secondary font-title-md rounded-xl shadow-lg opacity-50 cursor-not-allowed transition-all active:scale-95 flex items-center justify-center gap-2"
                id="continue-btn">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
            <p class="font-label-sm text-center text-on-surface-variant">Don't worry, you can change these later in
                settings.</p>
        </div>
    </main>
    <!-- Floating AI Bubble (Persistent Corner Anchor) -->

    <script>
        let selectedCount = 0;
        const continueBtn = document.getElementById('continue-btn');

        function toggleSelect(el) {
            const icon = el.querySelector('.selection-icon');
            const isActive = el.classList.contains('pulse-border');

            if (isActive) {
                el.classList.remove('pulse-border', 'bg-surface-container');
                icon.classList.add('opacity-0');
                selectedCount--;
            } else {
                el.classList.add('pulse-border', 'bg-surface-container');
                icon.classList.remove('opacity-0');
                selectedCount++;
            }

            updateButtonState();
        }

        function updateButtonState() {
            if (selectedCount > 0) {
                continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                continueBtn.classList.add('hover:bg-secondary-container');
            } else {
                continueBtn.classList.add('opacity-50', 'cursor-not-allowed');
                continueBtn.classList.remove('hover:bg-secondary-container');
            }
        }

        // Add a small delay animation for entering
        document.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('button[onclick="toggleSelect(this)"]');
            items.forEach((item, index) => {
                item.style.opacity = '0';
                item.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    item.style.transition = 'all 0.4s ease-out';
                    item.style.opacity = '1';
                    item.style.transform = 'translateY(0)';
                }, 100 * (index + 2));
            });
        });
    </script>


    <div id="snapdom-sandbox" data-snapdom-sandbox="true" aria-hidden="true"
