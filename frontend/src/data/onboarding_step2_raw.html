<style>
        body {

            color: #e3e2e6;

        }

            background: rgba(31, 31, 35, 0.6);
            backdrop-filter: blur(20px);

        .option-card-selected {
            border-color: #f2ae2e !important;

                              radial-gradient(at 100% 100%, rgba(242, 174, 46, 0.05) 0px, transparent 50%);

<body class="bg-background text-on-surface flex flex-col min-h-screen">
<!-- Progress Indicator - Top -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-highest z-[60]">
<div class="h-full bg-secondary w-3/4 transition-all duration-700 ease-out" id="progress-bar"></div>
</div>
<!-- Header (TopAppBar from SCREEN_28) -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 flex justify-between items-center w-full px-container-padding h-16">
<div class="flex items-center gap-stack-md">
<button class="p-2 hover:bg-surface-container-high rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<img alt="Finanu Logo" class="h-6 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEVed2cAWQhnZmCYEo8c7WnwYIxlNA8zO2VYCdovKuhg8KE8xlG8sQc2GXEJnMN9ixwYTJD6kYNpQY5zWsG8phfAnIPEbAVRwXXhi7uF2IfyHaMDGbrS9cbxmQ1uKXP6_JVfyznFvUHS4BGbnL8Lj_2hsO94H0FvU3lASYXdyoEWPjreBt9DIb-X8ccHLAdA3bkAYarOgY9tIlEr69X5ypl3nQV1XMAKsFN-5xraYqqsprwwB8RJ_DjBwylcNmUSw_KIjXOL-fLu0L">
</div>
<div class="flex items-center gap-2">
<span class="font-label-md text-on-surface-variant bg-surface-container px-3 py-1 rounded-full">Step 3 of 4</span>
<button class="p-2 hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col p-container-padding gradient-mesh max-w-lg mx-auto w-full">
<!-- Conversation Section -->
<div class="mt-stack-md space-y-stack-md">
<!-- Finn Chat Bubble -->
<div class="flex flex-col gap-base max-w-[85%]">
<div class="glass-panel p-stack-md rounded-xl rounded-tl-none">
<p class="font-body-md text-on-surface">
                        Understanding your risk comfort helps me tailor my suggestions. How do you feel about market volatility?
                    </p>
</div>
<span class="font-label-sm text-on-surface-variant ml-1">10:25 AM</span>
</div>
<!-- Options Grid -->
<div class="flex flex-col gap-stack-md pt-4">
<h3 class="font-label-md text-on-surface-variant uppercase tracking-wider ml-1">Select your profile</h3>
<div class="grid grid-cols-1 gap-gutter" id="options-list">
<!-- Option 1 -->
<button class="group relative flex items-center justify-between p-stack-md glass-panel rounded-xl hover:bg-surface-container transition-all duration-200 text-left" onclick="selectProfile(this)">
<div class="flex items-center gap-stack-md z-10">
<div class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary-container/20 text-primary">
<span class="material-symbols-outlined" data-weight="fill">shield</span>
</div>
<div>
<p class="font-title-md text-on-surface group-hover:text-secondary transition-colors">Low</p>
<p class="font-label-sm text-on-surface-variant">I prefer steady, low-risk growth</p>
</div>
</div>
<span class="material-symbols-outlined text-secondary opacity-0 transition-opacity z-10 check-icon">check_circle</span>
</button>
<!-- Option 2 -->
<button class="group relative flex items-center justify-between p-stack-md glass-panel rounded-xl hover:bg-surface-container transition-all duration-200 text-left" onclick="selectProfile(this)">
<div class="flex items-center gap-stack-md z-10">
<div class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary-container/20 text-primary">
<span class="material-symbols-outlined" data-weight="fill">balance</span>
</div>
<div>
<p class="font-title-md text-on-surface group-hover:text-secondary transition-colors">Medium</p>
<p class="font-label-sm text-on-surface-variant">I'm okay with some fluctuations</p>
</div>
</div>
<span class="material-symbols-outlined text-secondary opacity-0 transition-opacity z-10 check-icon">check_circle</span>
</button>
<!-- Option 3 -->
<button class="group relative flex items-center justify-between p-stack-md glass-panel rounded-xl hover:bg-surface-container transition-all duration-200 text-left" onclick="selectProfile(this)">
<div class="flex items-center gap-stack-md z-10">
<div class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary-container/20 text-primary">
<span class="material-symbols-outlined" data-weight="fill">trending_up</span>
</div>
<div>
<p class="font-title-md text-on-surface group-hover:text-secondary transition-colors">High</p>
<p class="font-label-sm text-on-surface-variant">Aggressive growth focus</p>
</div>
</div>
<span class="material-symbols-outlined text-secondary opacity-0 transition-opacity z-10 check-icon">check_circle</span>
</button>
</div>
</div>
</div>
<!-- Footer Action -->
<div class="mt-auto pb-8 pt-8 flex flex-col gap-stack-md">
<button class="w-full py-4 bg-secondary text-on-secondary font-title-md rounded-xl shadow-lg opacity-50 cursor-not-allowed transition-all active:scale-[0.98] flex items-center justify-center gap-2" disabled="" id="continue-btn">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="font-label-sm text-center text-on-surface-variant">Your risk profile can be adjusted anytime.</p>
</div>
</main>
<script>
        function selectProfile(element) {
            // Remove existing selections
            const options = document.querySelectorAll('#options-list button');
            options.forEach(opt => {
                opt.classList.remove('option-card-selected');
                opt.querySelector('.check-icon').classList.add('opacity-0');
            });

            // Set current selection
            element.classList.add('option-card-selected');
            element.querySelector('.check-icon').classList.remove('opacity-0');

            // Enable continue button
            const btn = document.getElementById('continue-btn');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            btn.classList.add('hover:bg-secondary/90');
        }

        // Animation logic similar to SCREEN_28
        document.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('#options-list button');
            items.forEach((item, index) => {
                item.style.opacity = '0';
                item.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    item.style.transition = 'all 0.4s ease-out';
                    item.style.opacity = '1';
                    item.style.transform = 'translateY(0)';
                }, 100 * (index + 2));
            });
        });
    </script>
