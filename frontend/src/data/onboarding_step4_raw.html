<script>
        function selectOption(element) {
            // Remove selection from all options
            const options = document.querySelectorAll('button.glass-card');
            options.forEach(opt => {
                opt.classList.remove('option-selected');
                const icon = opt.querySelector('span:last-child');
                icon.innerHTML = 'radio_button_unchecked';
                icon.classList.add('opacity-0');
            });

            // Add selection to clicked option
            element.classList.add('option-selected');
            const icon = element.querySelector('span:last-child');
            icon.innerHTML = 'check_circle';
            icon.classList.remove('opacity-0');
            icon.classList.add('text-primary');

            // Haptic feedback feel
            element.style.transform = 'scale(0.98)';
            setTimeout(() => element.style.transform = '', 100);
        }

        // Simple button interaction
        document.getElementById('completeBtn').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Finalizing...';
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined">check_circle</span> All Set!';
            }, 1500);
        });
