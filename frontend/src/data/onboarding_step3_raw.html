<script>
    let selectedElement = null;
    const continueBtn = document.getElementById('continue-btn');

    function toggleSelect(el) {
        // Remove active state from previous
        if (selectedElement) {
            selectedElement.classList.remove('pulse-border', 'bg-surface-container');
            selectedElement.querySelector('.selection-icon').classList.add('opacity-0');
        }

        // Set new active
        selectedElement = el;
        el.classList.add('pulse-border', 'bg-surface-container');
        el.querySelector('.selection-icon').classList.remove('opacity-0');

        // Enable button
        continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        continueBtn.disabled = false;
    }

    // Enter animations
    document.addEventListener('DOMContentLoaded', () => {
        const items = document.querySelectorAll('button[onclick="toggleSelect(this)"]');
        items.forEach((item, index) => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(10px)';
            setTimeout(() => {
                item.style.transition = 'all 0.4s ease-out';
                item.style.opacity = '1';
                item.style.transform = 'translateY(0)';
            }, 100 * (index + 2));
        });
    });
</script>
