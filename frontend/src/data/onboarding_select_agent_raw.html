<!-- Bottom Nav Bar (Supressed as this is a focused onboarding screen, but keeping shell logic for context) -->
<!-- Note: Following the "Destination" rule, we suppress global nav for transactional/onboarding flows -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 pointer-events-none" id="toast-container"></div>
<script>
        function selectAgent(agent) {
            const name = agent === 'finn' ? 'Finn' : 'Nova';
            const color = agent === 'finn' ? '#63f186' : '#ffba3c';
            
            showToast(`Setting up your experience with ${name}...`, color);
            
            // Interaction effect
            setTimeout(() => {
                const fabIcon = document.querySelector('#ai-fab .material-symbols-outlined');
                if (fabIcon) {
                    fabIcon.style.color = color;
                }
            }, 500);
        }

        function showToast(message, color) {
            const toast = document.createElement('div');
            toast.className = 'bg-surface-container-high text-on-surface px-6 py-3 rounded-full shadow-2xl flex items-center gap-base animate-bounce mb-4 border border-white/10';
            toast.style.borderColor = color;
            toast.innerHTML = `
                <span class="material-symbols-outlined" style="color: ${color}">check_circle</span>
                <span class="font-label-md">${message}</span>
            `;
            document.getElementById('toast-container').appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // Lightweight atmospheric effect: gentle glow following cursor on the cards
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });
    </script>
